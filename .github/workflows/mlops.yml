# ============================================================================
# CI/CD for the Energy DAM MCP forecasting pipeline.
#
#   CI      — lint + unit tests. No Azure needed, runs on every push/PR.
#   TRAIN   — submits the Azure ML pipeline (ingest -> ... -> promote) and waits.
#   DEPLOY  — ships the champion to the managed online endpoint.
#             Gated by the `production` GitHub Environment, so a human approves
#             before anything reaches the endpoint.
#
# SETUP (one time):
#   1. az ad sp create-for-rbac --name "gh-energy-mlops" --role Owner \
#        --scopes /subscriptions/<SUB_ID>/resourceGroups/rg-energy-mlops --json-auth
#      Owner rather than Contributor: infra/app.bicep creates two role
#      assignments and Contributor excludes Microsoft.Authorization/*/Write.
#   2. Paste the whole JSON into the repo secret AZURE_CREDENTIALS
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
#   3. Settings -> Environments -> New environment "production"
#      -> Required reviewers -> add yourself.   <-- this is the approval gate
# ============================================================================
name: mlops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_training:
        description: "Submit the Azure ML training pipeline"
        type: boolean
        default: true

env:
  RESOURCE_GROUP: rg-energy-mlops
  WORKSPACE: mlw-energy-forecast-v2
  ENDPOINT: dam-mcp-endpoint
  MODEL: dam_mcp_forecast

jobs:
  # ---------------------------------------------------------------------
  # CI — fast feedback, no cloud resources touched.
  # ---------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/requirements.txt pytest ruff

      - name: Lint
        run: ruff check src/ tests/

      - name: Unit tests
        run: pytest tests/ -q

  # ---------------------------------------------------------------------
  # TRAIN — submit the AML pipeline and block until it finishes.
  # `az ml job create --stream` exits non-zero if the pipeline fails, so a
  # failed data-quality gate or eval gate fails the workflow. That is the
  # whole point: bad data or a bad model never reaches the deploy job.
  # ---------------------------------------------------------------------
  train:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      job_name: ${{ steps.submit.outputs.job_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: az extension add -n ml -y

      - name: Submit training pipeline
        id: submit
        run: |
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE
          JOB=$(az ml job create -f aml/pipeline.yml --query name -o tsv)
          echo "job_name=$JOB" >> $GITHUB_OUTPUT
          echo "Submitted $JOB"
          az ml job stream -n "$JOB"

      # Azure ML's registry does not implement MLflow aliases (the alias API
      # 404s), so the champion pointer is the tag `champion=true` on exactly one
      # model version. Everything downstream resolves the tag to a version number.
      - name: Report champion
        run: |
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE
          az ml model list --name $MODEL \
            --query "[?tags.champion=='true'].{version:version,rmse:tags.eval_rmse,mape:tags.eval_mape}" -o table

  # ---------------------------------------------------------------------
  # DEPLOY — champion -> managed online endpoint.
  # `environment: production` makes GitHub pause here for approval.
  # ---------------------------------------------------------------------
  deploy:
    needs: train
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: az extension add -n ml -y

      - name: Create endpoint if absent
        run: |
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE
          az ml online-endpoint show -n $ENDPOINT >/dev/null 2>&1 \
            || az ml online-endpoint create -f aml/endpoints/endpoint.yml

      - name: Resolve champion version
        id: champion
        run: |
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE
          VERSION=$(az ml model list --name $MODEL \
            --query "[?tags.champion=='true'].version | [0]" -o tsv)
          if [ -z "$VERSION" ]; then
            echo "::error::No model version tagged champion=true"; exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Champion is $MODEL:$VERSION"

      - name: Deploy champion
        run: |
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE
          # create fails once the deployment exists, so update on later runs
          if az ml online-deployment show -n champion -e $ENDPOINT >/dev/null 2>&1; then
            az ml online-deployment update -f aml/endpoints/deployment.yml \
              --set model=azureml:$MODEL:${{ steps.champion.outputs.version }}
          else
            az ml online-deployment create -f aml/endpoints/deployment.yml \
              --set model=azureml:$MODEL:${{ steps.champion.outputs.version }} --all-traffic
          fi

      - name: Smoke test the endpoint
        run: |
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE
          az ml online-endpoint invoke -n $ENDPOINT \
            --request-file scoring/sample_request.json

  # ---------------------------------------------------------------------
  # MONITOR — daily drift schedule.
  # Architecture diagram edges  EP -. inference data .-> MON  and
  # A -. baseline .-> MON. Kept in step with the Azure DevOps pipeline's
  # Monitor stage so the two CI/CD definitions do not drift apart.
  # ---------------------------------------------------------------------
  monitor:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: az extension add -n ml -y

      - name: Create or refresh the drift monitor
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          set -e
          az configure --defaults group=$RESOURCE_GROUP workspace=$WORKSPACE

          if [ -z "$ALERT_EMAIL" ]; then
            echo "::error::Repository variable ALERT_EMAIL is not set"; exit 1
          fi

          # Baseline is produced by the pipeline's reference_data step.
          if ! az ml data show -n dam_mcp_reference --label latest >/dev/null 2>&1; then
            echo "::error::Data asset dam_mcp_reference not found - the pipeline reference_data step has not run"
            exit 1
          fi

          if az ml schedule show -n dam-mcp-drift-monitor >/dev/null 2>&1; then
            az ml schedule update -f aml/monitoring.yml \
              --set create_monitor.alert_notification.emails[0]=$ALERT_EMAIL
          else
            az ml schedule create -f aml/monitoring.yml \
              --set create_monitor.alert_notification.emails[0]=$ALERT_EMAIL
          fi
